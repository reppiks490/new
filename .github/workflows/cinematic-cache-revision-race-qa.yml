name: Cinematic cached-master revision race QA

on:
  pull_request:
    paths:
      - 'tests/test_cinematic_cache_revision_race_helper1.py'
      - 'app/video/cinematic_service.py'
      - 'app/video/storage.py'
      - '.github/workflows/cinematic-cache-revision-race-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cached-master-revision-race:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    env:
      CINEMATIC_REQUIRE_REAL_MEDIA: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify real FFmpeg and FFprobe (bounded package fallback)
        run: |
          set -euo pipefail
          # Ubuntu-hosted runners normally ship FFmpeg already. Unconditional
          # apt-get downloads caused Python 3.11 to time out before the test
          # in exact-head run 39933196241; preserve actual media verification.
          if command -v ffmpeg >/dev/null 2>&1 \
              && command -v ffprobe >/dev/null 2>&1 \
              && ffmpeg -hide_banner -encoders 2>/dev/null | grep -F 'libx264' >/dev/null; then
            echo 'Using existing FFmpeg/FFprobe with libx264 support'
          else
            echo 'FFmpeg or libx264 missing; bounded package install fallback'
            timeout 240s sudo apt-get update -qq -o Acquire::Retries=2 -o Acquire::http::Timeout=20
            timeout 240s sudo apt-get install -y --no-install-recommends -o Acquire::Retries=2 -o Acquire::http::Timeout=20 ffmpeg
          fi
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | sed -n '1p'
          ffprobe -version | sed -n '1p'
          ffmpeg -hide_banner -encoders 2>/dev/null | grep -F 'libx264'
      - name: Install application and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Prove cached-master response is revision-consistent
        run: python -m pytest -q -W error tests/test_cinematic_cache_revision_race_helper1.py

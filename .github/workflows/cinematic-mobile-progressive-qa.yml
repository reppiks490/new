name: Cinematic mobile progressive MP4 real-media QA

on:
  pull_request:
    paths:
      - 'scripts/cinematic_master_acceptance.py'
      - 'scripts/cinematic_mobile_h264_preflight.py'
      - 'scripts/cinematic_mobile_progressive_preflight.py'
      - 'tests/test_cinematic_mobile_progressive_preflight_qa19.py'
      - '.github/workflows/cinematic-mobile-progressive-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-progressive-real-media:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    env:
      CINEMATIC_REQUIRE_REAL_MEDIA: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Require FFmpeg FFprobe and libx264
        run: |
          set -euo pipefail
          if command -v ffmpeg >/dev/null 2>&1 \
              && command -v ffprobe >/dev/null 2>&1 \
              && ffmpeg -hide_banner -encoders 2>/dev/null | grep -F 'libx264' >/dev/null; then
            echo 'Using runner media binaries'
          else
            timeout 240s sudo apt-get update -qq -o Acquire::Retries=2 -o Acquire::http::Timeout=20
            timeout 240s sudo apt-get install -y --no-install-recommends -o Acquire::Retries=2 -o Acquire::http::Timeout=20 ffmpeg
          fi
          ffmpeg -hide_banner -encoders 2>/dev/null | grep -F 'libx264'
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Strict synthetic faststart and atom parser QA
        run: python -m pytest -q -W error tests/test_cinematic_mobile_progressive_preflight_qa19.py

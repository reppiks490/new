name: Cinematic 600s exact-cut boundary QA96

on:
  pull_request:
    paths:
      - 'tests/test_cinematic_600s_boundary_frames_qa96.py'
      - 'tests/test_cinematic_600s_all_shot_continuity_qa95.py'
      - '.github/qa/Dockerfile.cinematic-600s'
      - '.github/workflows/cinematic-600s-boundary-frames-qa96.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-cut-ffmpeg:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Build isolated local FFmpeg Python 3.12 image
        run: |
          set -euo pipefail
          docker build --file .github/qa/Dockerfile.cinematic-600s \
            --tag cinematic-600s-base:qa .

      - name: Stage QA96 and unchanged QA95 test in isolated container
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cinematic-600s-boundaries"
          cp tests/test_cinematic_600s_boundary_frames_qa96.py \
            "$RUNNER_TEMP/cinematic-600s-boundaries/"
          cp tests/test_cinematic_600s_all_shot_continuity_qa95.py \
            "$RUNNER_TEMP/cinematic-600s-boundaries/"
          docker build --file - --tag cinematic-600s-boundaries:qa \
            "$RUNNER_TEMP/cinematic-600s-boundaries" <<'DOCKERFILE'
          FROM cinematic-600s-base:qa
          USER root
          RUN mkdir -p /app/tests && chown -R 10001:10001 /app/tests
          COPY test_cinematic_600s_boundary_frames_qa96.py /app/tests/
          COPY test_cinematic_600s_all_shot_continuity_qa95.py /app/tests/
          USER 10001:10001
          DOCKERFILE

      - name: Test one-frame negative control and all 59 real assembly cut boundaries
        run: |
          set -euo pipefail
          mkdir -p test-results
          docker run --rm --network none --read-only \
            --pids-limit 2048 --memory 4g \
            --tmpfs /tmp:rw,nosuid,nodev,size=768m \
            --tmpfs /app/workspace/studio:rw,nosuid,nodev,size=512m,uid=10001,gid=10001 \
            --env CINEMATIC_BOUNDARY_MEDIA_QA=1 \
            --entrypoint python cinematic-600s-boundaries:qa \
            -m pytest -q -W error -p no:cacheprovider \
            tests/test_cinematic_600s_boundary_frames_qa96.py \
            2>&1 | tee test-results/cinematic-600s-boundaries-qa96.txt

      - name: Preserve exact-commit synthetic boundary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinematic-600s-boundaries-qa96
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

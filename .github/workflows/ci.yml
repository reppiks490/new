name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # Real Blender for the live render/export tests. bpy 5.0.1 ships
          # cp311 wheels only, so the 3.12 leg skips those tests. Isolated
          # venv: bpy pins numpy<2, the app needs numpy>=2.
          if [ "${{ matrix.python-version }}" = "3.11" ]; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends \
              libxrender1 libxxf86vm1 libxfixes3 libxi6 libxkbcommon0 libsm6 libgl1 libegl1
            python -m venv "$HOME/blender-bpy"
            "$HOME/blender-bpy/bin/pip" install bpy==5.0.1
            echo "BLENDER_BPY_PYTHON=$HOME/blender-bpy/bin/python" >> "$GITHUB_ENV"
            echo "BLENDER_BIN=$PWD/scripts/blender" >> "$GITHUB_ENV"
            BLENDER_BPY_PYTHON="$HOME/blender-bpy/bin/python" scripts/blender --version
          fi

      - name: Smoke-test app import
        run: python -c "import app.main; assert hasattr(app.main, 'app')"

      - name: Run tests (warnings as errors)
        run: python -m pytest -q -W error

  docker:
    runs-on: ubuntu-latest
    # GitHub Actions runners have a real Docker daemon, unlike the sandbox
    # this Dockerfile was authored in (no privileged daemon access there --
    # see README's Docker section). This job is where the image actually
    # gets built and smoke-tested for real.
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t character3d-masterbuild:ci .

      - name: Boot container and smoke-test /health
        run: |
          docker run -d --name c3d -p 8000:8000 character3d-masterbuild:ci
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8000/health; then break; fi
            sleep 1
          done
          curl -sf http://localhost:8000/health
          docker logs c3d
          docker stop c3d

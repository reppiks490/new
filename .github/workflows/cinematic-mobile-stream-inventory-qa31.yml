name: Cinematic mobile MP4 stream inventory QA31

on:
  pull_request:
    paths:
      - 'scripts/cinematic_mobile_stream_inventory_preflight_qa31.py'
      - 'tests/test_cinematic_mobile_stream_inventory_qa31.py'
      - '.github/workflows/cinematic-mobile-stream-inventory-qa31.yml'
      - 'scripts/cinematic_master_acceptance.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-mp4-stream-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    env:
      CINEMATIC_REQUIRE_STREAM_INVENTORY_QA: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify FFmpeg and FFprobe availability
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Install local application and tests
        run: python -m pip install -e '.[dev]'
      - name: Strict real synthetic MP4 stream-inventory regression
        run: python -m pytest -q -W error tests/test_cinematic_mobile_stream_inventory_qa31.py

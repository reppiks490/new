name: Helper 1 cinematic HTTP cancel/claim race QA119

on:
  pull_request:
    paths:
      - 'app/video/cinematic_assembly_jobs.py'
      - 'app/video/router.py'
      - 'app/studio/server.py'
      - 'app/video/storage.py'
      - 'tests/test_cinematic_helper1_cancel_claim_race_qa119.py'
      - '.github/workflows/cinematic-helper1-cancel-claim-race-qa119.yml'
  push:
    branches:
      - 'feat/cinematic-orchestrator-v1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cancel-claim-race:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install local application and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify real SQLite HTTP cancel versus worker-claim atomicity
        run: >-
          python -m pytest -q -W error -p no:cacheprovider
          tests/test_cinematic_helper1_cancel_claim_race_qa119.py

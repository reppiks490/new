name: Cinematic batch partial recovery QA38

on:
  pull_request:
    paths:
      - 'tests/test_cinematic_batch_partial_recovery_qa38.py'
      - '.github/workflows/cinematic-batch-partial-recovery-qa38.yml'
      - 'app/video/cinematic_service.py'
      - 'app/video/cinematic_rendering.py'
      - 'app/video/jobs.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  partial-batch-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    env:
      CINEMATIC_REQUIRE_BATCH_PARTIAL_RECEIPT_QA38: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install application test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Verify durable batch partial-failure recovery
        run: python -m pytest -q -W error tests/test_cinematic_batch_partial_recovery_qa38.py

name: Cinematic assembly cancel lock timestamp QA88

on:
  pull_request:
    paths:
      - 'app/video/cinematic_assembly_jobs.py'
      - 'tests/test_cinematic_assembly_cancel_lock_timestamp_qa88.py'
      - '.github/workflows/cinematic-assembly-cancel-lock-timestamp-qa88.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cancel-lock-timestamp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install local test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Verify serialized cancellation timestamp and control
        run: python -m pytest -q -W error tests/test_cinematic_assembly_cancel_lock_timestamp_qa88.py

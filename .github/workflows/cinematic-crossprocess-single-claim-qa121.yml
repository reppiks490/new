name: Cinematic independent-process single-claim QA121

on:
  pull_request:
    paths:
      - 'app/studio/storage.py'
      - 'app/video/cinematic_assembly_jobs.py'
      - 'tests/test_cinematic_crossprocess_single_claim_qa121.py'
      - '.github/workflows/cinematic-crossprocess-single-claim-qa121.yml'
  push:
    branches:
      - 'feat/cinematic-orchestrator-v1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  single-claim:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Verify independent-process FIFO claim and terminal CAS
        run: python -m pytest -q -W error -p no:cacheprovider tests/test_cinematic_crossprocess_single_claim_qa121.py

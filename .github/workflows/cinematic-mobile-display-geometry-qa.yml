name: Cinematic mobile display geometry real-media QA

on:
  pull_request:
    paths:
      - 'scripts/cinematic_mobile_display_geometry_preflight.py'
      - 'tests/test_cinematic_mobile_display_geometry_preflight_qa24.py'
      - '.github/workflows/cinematic-mobile-display-geometry-qa.yml'
      - 'scripts/cinematic_mobile_av_sync_preflight.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  display-geometry-real-media:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    env:
      CINEMATIC_REQUIRE_REAL_MEDIA: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Require genuine FFmpeg, FFprobe and libx264
        run: |
          set -euo pipefail
          if command -v ffmpeg >/dev/null 2>&1 \
              && command -v ffprobe >/dev/null 2>&1 \
              && ffmpeg -hide_banner -encoders 2>/dev/null | grep -F 'libx264' >/dev/null; then
            echo 'Using runner media binaries'
          else
            for sources in /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/ubuntu.sources; do
              if [ -f "$sources" ]; then
                sudo sed -i 's#http://azure.archive.ubuntu.com/ubuntu/#http://archive.ubuntu.com/ubuntu/#g' "$sources"
              fi
            done
            timeout 240s sudo apt-get update -qq -o Acquire::Retries=2 -o Acquire::http::Timeout=20
            timeout 480s sudo apt-get install -y --no-install-recommends -o Acquire::Retries=2 -o Acquire::http::Timeout=20 ffmpeg
          fi
          ffprobe -version | sed -n '1p'
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Verify real synthetic SAR and rotation rejection
        run: python -m pytest -q -W error tests/test_cinematic_mobile_display_geometry_preflight_qa24.py

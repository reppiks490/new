name: Cinematic Docker studio runtime contract (Helper 1)

# The default Dockerfile intentionally serves the legacy Character3D API.
# Cinematic release acceptance must boot the separate Dockerfile.cinematic,
# which installs FFmpeg and starts app.studio.server. Generic Docker coverage
# remains in the repository's ordinary CI; do not conflate the two contracts.
on:
  pull_request:
    paths:
      - 'tools/cinematic_docker_runtime_contract_helper1.py'
      - '.github/workflows/cinematic-docker-runtime-helper1.yml'
      - 'Dockerfile.cinematic'
      - 'app/studio/server.py'
      - 'app/video/router.py'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  studio-runtime-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - name: Build actual opt-in cinematic image with FFmpeg (no GPU/Blender)
        run: |
          set -euo pipefail
          docker build --file Dockerfile.cinematic \
            --build-arg PYTHON_VERSION=${{ matrix.python-version }} \
            --tag cinematic-helper1-studio:qa .

      - name: Boot nonroot cinematic studio in isolated offline container
        run: |
          set -euo pipefail
          # No host ports, network, owner footage, credentials, or paid APIs.
          # Temporary storage is isolated and bounded; image root stays read-only.
          docker run -d --name cinematic-helper1-qa --network none \
            --read-only --pids-limit 128 --memory 1g \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m \
            --tmpfs /app/workspace/studio:rw,nosuid,nodev,size=256m,uid=10001,gid=10001 \
            cinematic-helper1-studio:qa
          for i in $(seq 1 40); do
            if docker exec cinematic-helper1-qa python -c "import json; from urllib.request import urlopen; assert json.load(urlopen('http://127.0.0.1:8000/health', timeout=2)).get('studio') is True" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          echo "Cinematic studio did not expose its local /health endpoint" >&2
          docker logs cinematic-helper1-qa >&2
          exit 1

      - name: Assert studio API, real FFmpeg/ffprobe, and full H.264 decode
        run: |
          set -euo pipefail
          mkdir -p test-results
          docker exec -i cinematic-helper1-qa python - \
            < tools/cinematic_docker_runtime_contract_helper1.py \
            2>&1 | tee test-results/cinematic-docker-contract.txt

      - name: Capture ephemeral container diagnostics
        if: always()
        run: |
          mkdir -p test-results
          docker logs cinematic-helper1-qa > test-results/container.log 2>&1 || true
          docker rm -f cinematic-helper1-qa >/dev/null 2>&1 || true

      - name: Retain exact-head QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinematic-docker-runtime-py${{ matrix.python-version }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

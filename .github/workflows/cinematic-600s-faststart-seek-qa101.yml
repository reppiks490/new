name: Cinematic 600s faststart and indexed seek QA101

on:
  pull_request:
    paths:
      - 'tests/test_cinematic_600s_faststart_seek_qa101.py'
      - 'docs/CINEMATIC_FASTSTART_SEEK_QA101.md'
      - 'app/video/cinematic_service.py'
      - 'app/video/cinematic_editing.py'
      - 'app/video/storage.py'
      - '.github/qa/Dockerfile.cinematic-600s'
      - '.github/workflows/cinematic-600s-faststart-seek-qa101.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-faststart-seek:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Build existing isolated local FFmpeg image
        run: |
          set -euo pipefail
          docker build --file .github/qa/Dockerfile.cinematic-600s \
            --tag cinematic-600s-base:qa .

      - name: Stage QA101 test in separate image
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cinematic-faststart-qa101"
          cp tests/test_cinematic_600s_faststart_seek_qa101.py \
            "$RUNNER_TEMP/cinematic-faststart-qa101/"
          docker build --file - --tag cinematic-faststart:qa \
            "$RUNNER_TEMP/cinematic-faststart-qa101" <<'DOCKERFILE'
          FROM cinematic-600s-base:qa
          USER root
          RUN mkdir -p /app/tests && chown -R 10001:10001 /app/tests
          COPY test_cinematic_600s_faststart_seek_qa101.py /app/tests/
          USER 10001:10001
          DOCKERFILE

      - name: Verify actual 600s Character3D MP4 layout and input-side seeking
        run: |
          set -euo pipefail
          mkdir -p test-results
          docker run --rm --network none --read-only \
            --pids-limit 2048 --memory 4g \
            --tmpfs /tmp:rw,nosuid,nodev,size=768m \
            --tmpfs /app/workspace/studio:rw,nosuid,nodev,size=512m,uid=10001,gid=10001 \
            --env CINEMATIC_FASTSTART_QA=1 \
            --entrypoint python cinematic-faststart:qa \
            -m pytest -q -W error -p no:cacheprovider \
            tests/test_cinematic_600s_faststart_seek_qa101.py \
            2>&1 | tee test-results/cinematic-faststart-seek-qa101.txt

      - name: Preserve synthetic faststart/seek evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinematic-faststart-seek-qa101
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

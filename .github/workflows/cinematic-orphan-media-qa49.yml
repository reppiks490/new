name: Cinematic offline untracked MP4 inventory QA49

on:
  pull_request:
    paths:
      - 'tools/cinematic_orphan_media_audit_qa49.py'
      - 'tests/test_cinematic_orphan_media_audit_qa49.py'
      - '.github/workflows/cinematic-orphan-media-qa49.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-sqlite-and-real-ffmpeg:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Provision free local FFmpeg
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -hide_banner -version | head -n 1
          ffmpeg -hide_banner -encoders 2>/dev/null | grep -q libx264
      - name: Install isolated test dependency
        run: python -m pip install 'pytest>=8,<10'
      - name: Run strict offline synthetic SQLite and FFmpeg QA
        env:
          CINEMATIC_REQUIRE_REAL_MEDIA: '1'
        run: python -m pytest -q -W error tests/test_cinematic_orphan_media_audit_qa49.py

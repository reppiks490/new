name: Cinematic assembly pagination snapshot QA92

on:
  pull_request:
    paths:
      - 'app/video/cinematic_assembly_jobs.py'
      - 'tests/test_cinematic_assembly_pagination_snapshot_qa92.py'
      - '.github/workflows/cinematic-assembly-pagination-snapshot-qa92.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pagination-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install local test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Verify WAL pagination snapshot and control
        run: python -m pytest -q -W error tests/test_cinematic_assembly_pagination_snapshot_qa92.py

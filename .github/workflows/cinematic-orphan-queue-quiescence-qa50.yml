name: Cinematic orphan inventory queue quiescence QA50

on:
  pull_request:
    paths:
      - 'tools/cinematic_orphan_media_audit_qa49.py'
      - 'tests/test_cinematic_orphan_queue_quiescence_qa50.py'
      - 'tests/test_cinematic_orphan_media_audit_qa49.py'
      - '.github/workflows/cinematic-orphan-queue-quiescence-qa50.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-sqlite-and-synthetic-media:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify local FFmpeg availability
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -hide_banner -encoders 2>/dev/null | grep -q libx264
      - name: Install isolated pytest
        run: python -m pip install 'pytest>=8,<10'
      - name: Run strict QA49 and QA50 SQLite and synthetic FFmpeg tests
        env:
          CINEMATIC_REQUIRE_REAL_MEDIA: '1'
        run: |
          python -m pytest -q -W error \
            tests/test_cinematic_orphan_media_audit_qa49.py \
            tests/test_cinematic_orphan_queue_quiescence_qa50.py

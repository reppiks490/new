name: Cinematic independent-process cancel-claim QA120

on:
  pull_request:
    paths:
      - 'app/studio/storage.py'
      - 'app/video/cinematic_assembly_jobs.py'
      - 'app/video/storage.py'
      - 'tests/test_cinematic_crossprocess_cancel_claim_qa120.py'
      - 'docs/CINEMATIC_CROSSPROCESS_CANCEL_CLAIM_QA120_20261027.md'
      - '.github/workflows/cinematic-crossprocess-cancel-claim-qa120.yml'
  push:
    branches:
      - 'feat/cinematic-orchestrator-v1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crossprocess-cancel-claim:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Verify real cross-process SQLite cancellation versus claim
        run: |
          python -m pytest -q -W error -p no:cacheprovider \
            tests/test_cinematic_crossprocess_cancel_claim_qa120.py

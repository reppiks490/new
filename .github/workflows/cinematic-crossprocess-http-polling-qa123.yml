name: Cinematic cross-process HTTP polling QA123

on:
  pull_request:
    paths:
      - 'app/studio/storage.py'
      - 'app/studio/server.py'
      - 'app/video/router.py'
      - 'app/video/cinematic_assembly_jobs.py'
      - 'app/video/storage.py'
      - 'tests/test_cinematic_crossprocess_http_polling_qa123.py'
      - '.github/workflows/cinematic-crossprocess-http-polling-qa123.yml'
  push:
    branches:
      - 'feat/cinematic-orchestrator-v1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crossprocess-http-polling:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Verify authenticated polling through separate SQLite worker
        run: python -m pytest -q -W error -p no:cacheprovider tests/test_cinematic_crossprocess_http_polling_qa123.py

name: Cinematic assembly claim timestamp QA87

on:
  pull_request:
    paths:
      - 'app/video/cinematic_assembly_jobs.py'
      - 'tests/test_cinematic_assembly_claim_timestamp_qa87.py'
      - '.github/workflows/cinematic-assembly-claim-timestamp-qa87.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  claim-timestamp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install local test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Verify durable queue claim timestamp and serialization
        run: python -m pytest -q -W error tests/test_cinematic_assembly_claim_timestamp_qa87.py

name: Cinematic Docker actual master assembly acceptance (Helper 1)

on:
  pull_request:
    paths:
      - 'Dockerfile.cinematic'
      - '.github/workflows/cinematic-docker-master-endtoend-helper1.yml'
      - 'tools/cinematic_docker_real_assembly_helper1.py'
      - 'tools/cinematic_docker_runtime_contract_helper1.py'
      - 'app/video/cinematic_service.py'
      - 'app/video/cinematic_assembly_jobs.py'
      - 'app/video/router.py'
      - 'app/studio/server.py'
      - 'app/video/storage.py'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-master-in-container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Build opt-in cinematic image with system FFmpeg
        run: |
          set -euo pipefail
          docker build --file Dockerfile.cinematic \
            --build-arg PYTHON_VERSION=${{ matrix.python-version }} \
            --tag cinematic-helper1-master:qa .

      - name: Start offline nonroot cinematic server without owner mounts
        run: |
          set -euo pipefail
          docker run -d --name cinematic-helper1-master --network none \
            --read-only --pids-limit 128 --memory 1g \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m \
            --tmpfs /app/workspace/studio:rw,nosuid,nodev,size=256m,uid=10001,gid=10001 \
            cinematic-helper1-master:qa
          for i in $(seq 1 40); do
            if docker exec cinematic-helper1-master python -c \
              "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=2)).get('studio') is True" \
              >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs cinematic-helper1-master >&2
          exit 1

      - name: Prove actual async cinematic FFmpeg assembly and cache correctness
        run: |
          set -euo pipefail
          mkdir -p test-results
          docker exec -i cinematic-helper1-master python - \
            < tools/cinematic_docker_runtime_contract_helper1.py \
            2>&1 | tee test-results/baseline-container-contract.txt
          docker exec -i cinematic-helper1-master python - \
            < tools/cinematic_docker_real_assembly_helper1.py \
            2>&1 | tee test-results/actual-master-assembly.txt

      - name: Capture private-free diagnostics and destroy ephemeral container
        if: always()
        run: |
          mkdir -p test-results
          docker logs cinematic-helper1-master > test-results/container.log 2>&1 || true
          docker rm -f cinematic-helper1-master >/dev/null 2>&1 || true

      - name: Retain exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinematic-docker-real-master-py${{ matrix.python-version }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

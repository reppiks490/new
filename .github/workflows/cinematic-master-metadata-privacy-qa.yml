name: Cinematic master source metadata privacy real-media QA

on:
  pull_request:
    paths:
      - 'tests/test_cinematic_master_source_metadata_privacy_qa23.py'
      - '.github/workflows/cinematic-master-metadata-privacy-qa.yml'
  workflow_dispatch:

jobs:
  synthetic-ffmpeg-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    env:
      CINEMATIC_REQUIRE_REAL_MEDIA: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install signed Ubuntu FFmpeg and FFprobe packages
        run: |
          set -euo pipefail
          # Prefer the official mirror when a hosted runner uses a stalled Azure mirror.
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true
          sudo apt-get -o Acquire::Retries=2 update -qq
          sudo apt-get -o Acquire::Retries=2 install -y --no-install-recommends ffmpeg
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -hide_banner -encoders 2>/dev/null | grep -q libx264
      - name: Install local application test dependencies
        run: |
          python -m pip install -e '.[dev]'
      - name: Test actual master assembly metadata isolation with synthetic video
        run: >-
          python -m pytest -q -W error
          tests/test_cinematic_master_source_metadata_privacy_qa23.py

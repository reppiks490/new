name: Helper 1 genuine cross-process master cache QA125

on:
  pull_request:
    paths:
      - 'app/video/cinematic_service.py'
      - 'app/video/cinematic_editing.py'
      - 'app/video/cinematic_models.py'
      - 'app/video/cinematic_requests.py'
      - 'app/video/storage.py'
      - 'tests/test_cinematic_helper1_crossprocess_cache_qa125.py'
      - '.github/workflows/cinematic-helper1-crossprocess-cache-qa125.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-media-crossprocess-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    env:
      CINEMATIC_HELPER1_CACHE_QA125: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install FFmpeg and FFprobe for actual local media proof
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Verify cache identity, invalidation, tamper rejection and full decode
        run: python -m pytest -q -W error -p no:cacheprovider tests/test_cinematic_helper1_crossprocess_cache_qa125.py

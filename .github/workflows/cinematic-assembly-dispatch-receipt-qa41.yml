name: Cinematic master dispatch receipt QA41

on:
  push:
    branches:
      - chatgpt/cinematic-assembly-dispatch-receipt-qa41-20261024
    paths:
      - 'tests/test_cinematic_assembly_dispatch_receipt_qa41.py'
      - '.github/workflows/cinematic-assembly-dispatch-receipt-qa41.yml'
      - 'app/video/cinematic_assembly_jobs.py'
      - 'app/video/router.py'
  pull_request:
    paths:
      - 'tests/test_cinematic_assembly_dispatch_receipt_qa41.py'
      - '.github/workflows/cinematic-assembly-dispatch-receipt-qa41.yml'
      - 'app/video/cinematic_assembly_jobs.py'
      - 'app/video/router.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch-receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    env:
      CINEMATIC_REQUIRE_ASSEMBLY_DISPATCH_RECEIPT_QA41: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install application test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Verify SQLite recovery control and strict authenticated receipt contract
        run: python -m pytest -q -W error tests/test_cinematic_assembly_dispatch_receipt_qa41.py

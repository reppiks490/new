name: Cinematic source coverage QA37

on:
  pull_request:
    paths:
      - 'app/video/cinematic_source_coverage_qa37.py'
      - 'tests/test_cinematic_source_coverage_qa37.py'
      - 'docs/CINEMATIC_SOURCE_COVERAGE_QA37_20261024.md'
      - '.github/workflows/cinematic-source-coverage-qa37.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Provision FFmpeg and FFprobe only if absent
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            for sources in /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/ubuntu.sources; do
              if [ -f "$sources" ]; then
                sudo sed -i 's#http://azure.archive.ubuntu.com/ubuntu/#http://archive.ubuntu.com/ubuntu/#g' "$sources"
              fi
            done
            timeout 240s sudo apt-get update -qq -o Acquire::Retries=2 -o Acquire::http::Timeout=20
            timeout 480s sudo apt-get install -y --no-install-recommends -o Acquire::Retries=2 -o Acquire::http::Timeout=20 ffmpeg
          fi
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -hide_banner -encoders 2>/dev/null | grep -F 'libx264'
      - name: Install isolated test runner
        run: python -m pip install pytest
      - name: Genuine synthetic media and metadata QA
        env:
          CINEMATIC_REQUIRE_REAL_MEDIA: '1'
        run: python -m pytest -q -W error tests/test_cinematic_source_coverage_qa37.py

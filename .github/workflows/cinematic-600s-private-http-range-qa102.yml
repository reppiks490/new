name: Cinematic 600s authenticated HTTP Range QA102

on:
  pull_request:
    paths:
      - 'tests/test_cinematic_600s_private_http_range_qa102.py'
      - 'docs/CINEMATIC_600S_PRIVATE_HTTP_RANGE_QA102.md'
      - 'app/video/router.py'
      - 'app/studio/server.py'
      - 'app/video/cinematic_service.py'
      - 'app/video/storage.py'
      - '.github/qa/Dockerfile.cinematic-600s'
      - '.github/workflows/cinematic-600s-private-http-range-qa102.yml'
  push:
    branches:
      - 'feat/cinematic-orchestrator-v1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-private-http-range:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Build offline-capable FFmpeg test image
        run: |
          set -euo pipefail
          docker build --file .github/qa/Dockerfile.cinematic-600s \
            --tag cinematic-600s-base:qa .

      - name: Stage isolated QA102 test
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cinematic-http-range-qa102"
          cp tests/test_cinematic_600s_private_http_range_qa102.py \
            "$RUNNER_TEMP/cinematic-http-range-qa102/"
          docker build --file - --tag cinematic-http-range:qa \
            "$RUNNER_TEMP/cinematic-http-range-qa102" <<'DOCKERFILE'
          FROM cinematic-600s-base:qa
          USER root
          RUN mkdir -p /app/tests && chown -R 10001:10001 /app/tests
          COPY test_cinematic_600s_private_http_range_qa102.py /app/tests/
          USER 10001:10001
          DOCKERFILE

      - name: Verify 600s actual assembly via authenticated HTTP byte ranges
        run: |
          set -euo pipefail
          mkdir -p test-results
          docker run --rm --network none --read-only \
            --pids-limit 2048 --memory 4g \
            --tmpfs /tmp:rw,nosuid,nodev,size=768m \
            --tmpfs /app/workspace/studio:rw,nosuid,nodev,size=512m,uid=10001,gid=10001 \
            --env CINEMATIC_600S_HTTP_RANGE_QA=1 \
            --entrypoint python cinematic-http-range:qa \
            -m pytest -q -W error -p no:cacheprovider \
            tests/test_cinematic_600s_private_http_range_qa102.py \
            2>&1 | tee test-results/cinematic-600s-http-range-qa102.txt

      - name: Preserve synthetic HTTP Range QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinematic-600s-http-range-qa102
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

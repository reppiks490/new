name: Cinematic completed master frame parity QA55

on:
  pull_request:
    paths:
      - 'tools/cinematic_completed_master_decode_qa54.py'
      - 'tests/test_cinematic_master_frame_attestation_qa55.py'
      - '.github/workflows/cinematic-master-frame-attestation-qa55.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-frame-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Require genuine FFmpeg and ffprobe
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -hide_banner -encoders 2>/dev/null | grep -F libx264 >/dev/null
      - name: Install pytest
        run: python -m pip install 'pytest>=8,<10'
      - name: Strict synthetic QA54 + QA55
        env:
          CINEMATIC_REQUIRE_REAL_MEDIA: '1'
        run: python -m pytest -q -W error tests/test_cinematic_completed_master_decode_qa54.py tests/test_cinematic_master_frame_attestation_qa55.py
